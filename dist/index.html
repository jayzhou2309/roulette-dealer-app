  function bulkForm(d) {
    const w = wheelOf(d);
    openSheet(`<h2>Paste past results</h2>
      <form data-form="bulk" class="stack">
        <label class="f"><span>Results, separated by spaces, commas or new lines</span><textarea class="in" name="text" id="f-btext" placeholder="17 32 0 5 ${w.size === 38 ? '00 ' : ''}21" required></textarea></label>
        <label class="f"><span>Order of the list</span><select class="in" name="order" id="f-border"><option value="oldest">Oldest first</option><option value="newest">Newest first</option></select></label>
        <div class="grid2">
          <label class="f"><span>Time of the latest spin</span><input class="in" type="datetime-local" step="1" name="end" id="f-bend" value="${toLocalInput(Date.now())}" required></label>
          <label class="f"><span>Seconds between spins</span><input class="in" type="number" min="1" max="3600" name="gap" id="f-bgap" value="60" required></label>
        </div>
        <label class="f"><span>Session</span><input class="in" name="session" id="f-bsession" maxlength="60" value="${esc(prefs.session[d.id] || '')}"></label>
        <div class="small" id="bulk-preview" aria-live="polite">Paste results to check them.</div>
        <button class="btn primary block" id="bulk-go" disabled>Record results</button>
      </form>`, (sheet) => {
      const upd = () => {
        const r = parseBulk(sheet.querySelector('#f-btext').value, w);
        sheet.querySelector('#bulk-preview').innerHTML = !r.tokens ? 'Paste results to check them.'
          : `<b class="num">${r.valid.length}</b> valid${r.invalid.length ? ` · <span style="color:var(--bad)">not on this wheel: ${r.invalid.slice(0, 12).map(esc).join(', ')}${r.invalid.length > 12 ? '…' : ''}</span>` : ''}`;
        sheet.querySelector('#bulk-go').disabled = !r.valid.length || r.invalid.length > 0;
        sheet.querySelector('#bulk-go').textContent = r.invalid.length ? 'Fix invalid results first' : `Record ${r.valid.length} result${r.valid.length === 1 ? '' : 's'}`;
      };
      sheet.querySelector('#f-btext').addEventListener('input', upd);
    });
  }
  function parseBulk(text, w) {
    const toks = String(text).split(/[\s,;]+/).filter(Boolean);
    const valid = [], invalid = [];
    for (const t of toks) { const p = C.parsePocket(t, w); p === null ? invalid.push(t) : valid.push(p); }
    return { tokens: toks.length, valid, invalid };
  }

  function dataSheet() {
    const counts = { casinos: Object.keys(S.casinos).length, dealers: Object.keys(S.dealers).length, spins: Object.values(S.ledgers).reduce((a, l) => a + l.spins.length, 0), preds: Object.keys(S.preds).length };
    const local = store.kind === 'cloud' ? readLocal() : null;
    const localSpins = local ? Object.values(local.ledgers || {}).reduce((a, l) => a + (l.spins?.length || 0), 0) : 0;
    const hasSample = Object.values(S.casinos).some((c) => c.sample);
    openSheet(`<h2>Backup and data</h2>
      <div class="notice">${store.kind === 'cloud' ? '<strong>Saved to your claude.ai account</strong>Records are private to you and available wherever you open this app signed in.' : (STANDALONE ? '<strong>Saved on this phone</strong>Records stay in this app on this device. Export a backup regularly; deleting the app or clearing its data removes them.' : '<strong>Saved on this device only</strong>Export a backup regularly; clearing browser data removes these records.')}</div>
      <p class="small num" style="margin:0">${counts.casinos} casinos · ${counts.dealers} dealers · ${counts.spins.toLocaleString()} spins · ${counts.preds} saved estimates</p>
      <button class="btn primary block" data-act="export">Export backup (.json)</button>
      <label class="f"><span>Restore or merge a backup</span><input class="in" type="file" accept="application/json,.json" id="import-file"></label>
      ${local && localSpins ? `<button class="btn block" data-act="adopt-local">Move ${localSpins.toLocaleString()} spins saved on this device into your account</button>` : ''}
      <div id="export-fallback"></div>
      <hr style="border:0;border-top:1px solid var(--line);width:100%">
      <p class="small muted" style="margin:0">Simulated sample data uses a fair random wheel, so it shows what the analytics look like when there is no edge to find.</p>
      ${hasSample ? '<button class="btn danger block" data-act="clear-sample">Remove sample data</button>' : '<button class="btn block" data-act="sample">Load simulated sample</button>'}
    `, (sheet) => {
      sheet.querySelector('#import-file').addEventListener('change', async (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        try { const n = mergeData(JSON.parse(await f.text())); closeSheet(); render(); toast(`Imported ${n} records.`); }
        catch { toast('That file is not a backup from this app.'); }
      });
    });
  }

  function exportPayload() { return JSON.stringify({ app: 'roulette-dealer-analytics', version: 1, exportedAt: new Date().toISOString(), ...S }, null, 1); }

  function mergeData(data) {
    if (!data || typeof data !== 'object' || !data.casinos || !data.dealers) throw new Error('bad');
    let n = 0;
    for (const [id, c] of Object.entries(data.casinos)) if (c?.name) { putCasino({ ...c, id }); n++; }
    for (const [id, d] of Object.entries(data.dealers)) if (d?.casinoId && S.casinos[d.casinoId]) { putDealer({ ...d, id }); n++; }
    for (const [id, l] of Object.entries(data.ledgers || {})) if (l?.dealerId && S.dealers[l.dealerId] && Array.isArray(l.spins)) { S.ledgers[id] = l; putLedger(id); n += l.spins.length; }
    for (const [id, p] of Object.entries(data.preds || {})) if (p?.dealerId && S.dealers[p.dealerId] && Array.isArray(p.probs)) { S.preds[id] = p; store.put('preds', id, p); n++; }
    return n;
  }

  function loadSample() {
    const r = C.rng(20261018);
    const now = Date.now();
    const plan = [
      { name: 'Marina Bay Sands (sample)', location: 'Singapore', dealers: [['Dealer A', '12', 420], ['Dealer B', '12', 260], ['Dealer C', '7', 90]] },
      { name: 'Resorts World Sentosa (sample)', location: 'Sentosa, Singapore', dealers: [['Dealer K', '3', 340], ['Dealer M', '5', 150]] },
    ];
    for (const pc of plan) {
      const c = { id: newId('c'), name: pc.name, location: pc.location, notes: 'Simulated data from a fair random wheel.', meta: {}, wheel: 'EU', status: 'active', createdAt: now, sample: true };
      putCasino(c);
      for (const [name, table, n] of pc.dealers) {
        const d = { id: newId('d'), casinoId: c.id, name, table, notes: 'Simulated', wheel: 'EU', status: 'active', createdAt: now };
        putDealer(d);
        const spins = [];
        let t = now - n * 100e3 - Math.floor(n / 60) * 3 * 36e5 - 6e5 - Math.floor(r() * 36e5); // ends before now
        for (let i = 0; i < n; i++) {
          if (i && i % 60 === 0) t += 3 * 36e5; // a break between sessions
          t += 50e3 + Math.floor(r() * 50e3);
          const s = makeSpin(d, Math.floor(r() * 37), t, `Session ${1 + Math.floor(i / 60)}`);
          s.rt = t + 2000;
          spins.push(s);
        }
        addSpins(d, spins);
      }
    }
  }

  // ---------- actions ----------
  const A = {
    home: () => go({ name: 'home' }),
    casino: (el) => go({ name: 'casino', casinoId: el.dataset.id }),
    dealer: (el) => { hist.limit = 300; go({ name: 'dealer', dealerId: el.dataset.id, tab: 'record' }); },
    tab: (el) => { V.tab = el.dataset.tab; window.scrollTo(0, 0); render(); savePrefs(); },
    'toggle-archived': () => { prefs.showArchived = !prefs.showArchived; savePrefs(); render(); },
    'new-casino': () => casinoForm(null),
    'edit-casino': () => casinoForm(S.casinos[V.casinoId]),
    'new-dealer': () => dealerForm(null),
    'edit-dealer': () => dealerForm(S.dealers[V.dealerId]),
    'dealer-filter': (el) => { prefs.dealerFilter = el.dataset.f; savePrefs(); render(); },
    'archive-casino': () => {
      const c = S.casinos[V.casinoId];
      putCasino({ ...c, status: c.status === 'archived' ? 'active' : 'archived' });
      closeSheet(); render(); toast(c.status === 'archived' ? 'Casino restored.' : 'Casino archived. Its history is kept.');
    },
    'remove-casino': () => {
      const c = S.casinos[V.casinoId];
      $('#confirm-slot').innerHTML = `<div class="notice caution stack"><span>Remove <b>${esc(c.name)}</b> permanently?</span><div class="row"><button type="button" class="btn danger" data-act="remove-casino-yes">Remove</button><button type="button" class="btn" data-act="close">Keep it</button></div></div>`;
    },
    'remove-casino-yes': () => {
      const c = S.casinos[V.casinoId];
      if (dealersOf(c.id).length) return;
      delete S.casinos[c.id]; store.del('casinos', c.id);
      closeSheet(); go({ name: 'home' }); toast(`${c.name} removed.`);
    },
    'archive-dealer': () => {
      const d = S.dealers[V.dealerId];
      putDealer({ ...d, status: d.status === 'archived' ? 'active' : 'archived' });
      closeSheet(); render(); toast(d.status === 'archived' ? 'Dealer restored.' : 'Dealer archived. History is kept.');
    },
    'remove-dealer': () => {
      const d = S.dealers[V.dealerId];
      const n = allSpinsOf(d.id).length;
      $('#confirm-slot').innerHTML = `<div class="notice caution stack"><span>This deletes <b>${esc(d.name)}</b>, ${n.toLocaleString()} spins and ${predsOf(d.id).length} saved estimates. Archive instead to keep them. Type the dealer name to confirm.</span>
        <input class="in" id="confirm-name" autocomplete="off" aria-label="Dealer name"><button type="button" class="btn danger" data-act="remove-dealer-yes" id="confirm-go" disabled>Delete dealer and history</button></div>`;
      $('#confirm-name').addEventListener('input', (e) => { $('#confirm-go').disabled = e.target.value.trim() !== d.name.trim(); });
      $('#confirm-name').focus();
    },
    'remove-dealer-yes': () => {
      const d = S.dealers[V.dealerId];
      if ($('#confirm-name')?.value.trim() !== d.name.trim()) return;
      removeDealer(d.id); closeSheet(); go({ name: 'casino', casinoId: d.casinoId }); toast(`${d.name} removed.`);
    },
    close: () => closeSheet(),
    rec: (el) => {
      const d = S.dealers[V.dealerId];
      const p = Number(el.dataset.p);
      if (C.parsePocket(C.label(p), wheelOf(d)) === null) return;
      const now = Date.now();
      if (lastTap.p === p && now - lastTap.at < 700) { toast('Ignored a double tap.'); return; }
      lastTap = { p, at: now };
      const s = makeSpin(d, p, customTime ?? now, prefs.session[d.id]);
      addSpins(d, [s]);
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 250);
      refreshRecord(d);
      toast(`Recorded ${C.label(p)}${customTime ? ` at ${fmtClock(customTime)}` : ''}.`, 'Undo', () => {
        const f = findSpin(d.id, s.id);
        if (!f) return;
        f.l.spins.splice(f.i, 1); putLedger(f.id); render(); toast(`Removed ${C.label(p)}.`);
      });
    },
    'undo-last': () => {
      const d = S.dealers[V.dealerId];
      const last = lastRecorded(d.id);
      const f = last && findSpin(d.id, last.id);
      if (!f) return;
      f.s.del = Date.now(); f.s.log = [...(f.s.log || []), { action: 'deleted', at: Date.now() }]; putLedger(f.id);
      lastTap = { p: null, at: 0 }; // re-entering the same number right away is a correction, not a double tap
      refreshRecord(d);
      toast(`Removed ${C.label(f.s.pocket)}.`, 'Restore', () => {
        const g = findSpin(d.id, f.s.id);
        if (!g) return;
        delete g.s.del; g.s.log = [...(g.s.log || []), { action: 'restored', at: Date.now() }]; putLedger(g.id);
        render(); toast(`Restored ${C.label(g.s.pocket)}.`);
      });
    },
    'time-now': () => { customTime = null; render(); },
    bulk: () => bulkForm(S.dealers[V.dealerId]),
    hsort: (el) => { hist.sort = el.dataset.v; render(); },
    hmore: () => { hist.limit += 300; render(); },
    'edit-spin': (el) => { const d = S.dealers[V.dealerId]; const f = findSpin(d.id, el.dataset.id); if (f) spinForm(d, f.s); },
    'delete-spin': (el) => {
      const d = S.dealers[V.dealerId]; const f = findSpin(d.id, el.dataset.id);
      if (!f) return;
      f.s.del = Date.now(); f.s.log = [...(f.s.log || []), { action: 'deleted', at: Date.now() }]; putLedger(f.id);
      closeSheet(); render();
      toast(`Deleted ${C.label(f.s.pocket)}.`, 'Undo', () => A['restore-spin'](el));
    },
    'restore-spin': (el) => {
      const d = S.dealers[V.dealerId]; const f = findSpin(d.id, el.dataset.id);
      if (!f) return;
      delete f.s.del; f.s.log = [...(f.s.log || []), { action: 'restored', at: Date.now() }]; putLedger(f.id);
      closeSheet(); render(); toast('Spin restored.');
    },
    swin: (el) => { const v = el.dataset.v; prefs.swin[V.dealerId] = v === 'all' ? 'all' : Number(v); savePrefs(); render(); },
    pwin: (el) => { const v = el.dataset.v; prefs.pwin[V.dealerId] = v === 'all' ? 'all' : Number(v); savePrefs(); render(); },
    sector: (el) => { prefs.sector = el.dataset.v; savePrefs(); render(); },
    twin: (el) => { const v = el.dataset.v; prefs.twin[V.dealerId] = v === 'all' ? 'all' : Number(v); savePrefs(); render(); },
    bankroll: (el) => { prefs.bankroll = Number(el.dataset.v); savePrefs(); render(); },

    halflife: (el) => { prefs.halfLife = Number(el.dataset.v); savePrefs(); render(); },
    model: (el) => { prefs.model = el.dataset.v; savePrefs(); render(); },
    'save-pred': () => {
      const d = S.dealers[V.dealerId], w = wheelOf(d);
      const win = prefs.pwin[d.id] ?? 100;
      const all = spinsOf(d.id), sp = C.windowed(all, win);
      const mp = modelParams();
      const params = prefs.model === 'weighted' ? mp : prefs.model === 'smoothed' ? { alpha: mp.alpha } : {};
      const p = {
        id: newId('p'), casinoId: d.casinoId, dealerId: d.id, createdAt: Date.now(),
        cutoff: all.length ? all[all.length - 1].t : 0, window: win, model: prefs.model, modelVersion: C.MODEL_VERSION[prefs.model], params,
        wheel: w.type, n: sp.length, from: sp[0]?.t ?? null, to: sp[sp.length - 1]?.t ?? null,
        probs: C.predict(prefs.model, sp.map((s) => s.pocket), w, params).map((x) => Math.round(x * 1e8) / 1e8),
      };
      const pk0 = prefs.model === 'baseline' ? null : C.pick(p.probs, sp.map((s) => s.pocket), w);
      if (pk0) {
        const o = betOpt();
        p.pick = pk0.pocket;
        p.sector = C.bestSector(p.probs, w, o.k, pk0.pocket, o.mode, C.gaps(sp.map((s) => s.pocket), w)).pockets;
        p.betType = o.key;
        p.stake = prefs.stake > 0 ? prefs.stake : 10;
      }
      S.preds[p.id] = p; store.put('preds', p.id, p);
      render(); toast('Estimate saved. It is scored when the next spin is recorded.');
    },
    data: () => dataSheet(),
    export: async () => {
      const data = exportPayload();
      const name = `roulette-backup-${new Date().toISOString().slice(0, 10)}.json`;
      let dl = null;
      try { dl = await window.claude?.use?.('downloads'); } catch { /* fall through */ }
      if (dl) {
        try { await dl.save({ filename: name, data }); return; }
        catch (e) { if (e?.code === 'declined') return; }
      }
      const slot = $('#export-fallback');
      if (slot) {
        slot.innerHTML = `<label class="f"><span>Downloads aren't available here. Copy this backup and keep it somewhere safe.</span><textarea class="in mono" id="export-text" readonly style="min-height:140px;font-size:11px">${esc(data)}</textarea></label><button class="btn block" data-act="copy-export">Copy backup</button>`;
      }
    },
    'copy-export': async () => {
      const ta = $('#export-text');
      try { await navigator.clipboard.writeText(ta.value); toast('Backup copied.'); }
      catch { ta.select(); toast('Select-all is ready. Copy it with your keyboard or long-press.'); }
    },
    'adopt-local': () => { const n = mergeData(readLocal()); closeSheet(); render(); toast(`Moved ${n} records into your account.`); },
    sample: () => { loadSample(); closeSheet(); render(); toast('Loaded simulated sample data.'); },
    'clear-sample': () => {
      for (const c of Object.values(S.casinos).filter((x) => x.sample)) {
        for (const d of dealersOf(c.id)) removeDealer(d.id);
        delete S.casinos[c.id]; store.del('casinos', c.id);
      }
      closeSheet(); go({ name: 'home' }); toast('Sample data removed.');
    },
  };

  const F = {
    casino(form) {
      const fd = new FormData(form);
      const name = String(fd.get('name')).trim();
      if (!name) return;
      const meta = {};
      for (const line of String(fd.get('meta') || '').split('\n')) {
        const i = line.indexOf(':');
        if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      }
      const id = form.dataset.id;
      const base = id ? S.casinos[id] : { id: newId('c'), status: 'active', createdAt: Date.now() };
      const c = { ...base, name, location: String(fd.get('location')).trim(), wheel: fd.get('wheel') === 'US' ? 'US' : 'EU', notes: String(fd.get('notes')).trim(), meta };
      putCasino(c);
      closeSheet();
      if (id) { render(); toast('Casino saved.'); } else go({ name: 'casino', casinoId: c.id });
    },
    dealer(form) {
      const fd = new FormData(form);
      const name = String(fd.get('name')).trim();
      if (!name) return;
      const id = form.dataset.id;
      const base = id ? S.dealers[id] : { id: newId('d'), casinoId: V.casinoId, status: 'active', createdAt: Date.now() };
      const locked = id && allSpinsOf(id).length > 0;
      const d = { ...base, name, table: String(fd.get('table')).trim(), notes: String(fd.get('notes')).trim(), wheel: locked ? base.wheel : fd.get('wheel') === 'US' ? 'US' : 'EU' };
      putDealer(d);
      closeSheet();
      if (id) { render(); toast('Dealer saved.'); } else go({ name: 'dealer', dealerId: d.id, tab: 'record' });
    },
    spin(form) {
      const d = S.dealers[V.dealerId];
      const f = findSpin(d.id, form.dataset.id);
      if (!f) return;
      const fd = new FormData(form);
      const pocket = Number(fd.get('pocket'));
      const t = fromLocalInput(fd.get('t'));
      if (t === null || pocket < 0 || pocket >= wheelOf(d).size) { toast('Enter a valid pocket and time.'); return; }
      const next = { pocket, t, session: String(fd.get('session')).trim(), notes: String(fd.get('notes')).trim() };
      const s = f.s;
      if (next.pocket === s.pocket && next.t === s.t && next.session === s.session && next.notes === s.notes) { closeSheet(); return; }
      s.log = [...(s.log || []), { pocket: s.pocket, t: s.t, session: s.session, notes: s.notes, at: Date.now() }];
      Object.assign(s, next);
      putLedger(f.id);
      closeSheet(); render(); toast('Spin corrected. Statistics updated.');
    },
    bulk(form) {
      const d = S.dealers[V.dealerId];
      const fd = new FormData(form);
      const r = parseBulk(fd.get('text'), wheelOf(d));
      const end = fromLocalInput(fd.get('end'));
      const gap = Math.max(1, Number(fd.get('gap')) || 60) * 1000;
      if (!r.valid.length || r.invalid.length || end === null) return;
      const list = fd.get('order') === 'newest' ? r.valid.slice().reverse() : r.valid;
      const session = String(fd.get('session')).trim();
      const spins = list.map((p, i) => makeSpin(d, p, end - (list.length - 1 - i) * gap, session));
      addSpins(d, spins);
      closeSheet(); render(); toast(`Recorded ${spins.length} past results.`);
    },
  };

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (t && !t.disabled) { hideTip(); A[t.dataset.act]?.(t, e); return; }
    const tipT = e.target.closest('[data-tip]');
    if (tipT) showTip(tipT); else hideTip();
  });
  document.addEventListener('pointerover', (e) => { if (e.pointerType !== 'mouse') return; const t = e.target.closest('[data-tip]'); t ? showTip(t) : hideTip(); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest?.('[data-tip]'); if (t) showTip(t); });
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('submit', (e) => { e.preventDefault(); F[e.target.dataset.form]?.(e.target); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); hideTip(); } });
  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'dealer-search') { prefs.dealerQuery = e.target.value; $('#dealer-list').innerHTML = dealerListHtml(S.casinos[V.casinoId]); }
    else if (id === 'rec-session') { prefs.session[V.dealerId] = e.target.value; savePrefs(); }
    else if (id === 'alpha') { $('#alpha-v').textContent = e.target.value; }
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'rec-time') { customTime = e.target.value ? fromLocalInput(e.target.value) : null; render(); }
    else if (id === 'alpha') { prefs.alpha = Number(e.target.value); savePrefs(); render(); }
    else if (id === 'stake') { const v = Number(e.target.value); if (v > 0) { prefs.stake = v; savePrefs(); } render(); }
    else if (id === 'h-from') { hist.from = e.target.value; render(); }
    else if (id === 'h-to') { hist.to = e.target.value; render(); }
    else if (id === 'h-session') { hist.session = e.target.value; render(); }
    else if (id === 'h-del') { hist.showDel = e.target.checked; render(); }
  });

  // ---------- boot ----------
  async function boot() {
    render();
    let adapter = null, data = null;
    try {
      const cl = window.claude;
      if (cl?.use) {
        const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
        const uid = user ? await user.id() : null;
        if (db && uid) { adapter = CloudStore(db, uid); data = await adapter.load(); }
      }
    } catch { adapter = null; }
    if (!adapter) {
      adapter = LocalStore(); data = await adapter.load();
      try { await navigator.storage?.persist?.(); } catch { /* best effort: ask the browser not to evict records */ }
    }
    store = adapter;
    for (const k of Object.keys(S)) S[k] = (data && data[k]) || {};
    ready = true;
    V = validView(prefs.view || { name: 'home' });
    render();
  }
  boot();
})();

</script>
