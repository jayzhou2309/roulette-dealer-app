    const d = S.dealers[V.dealerId];
    V.tab = V.tab || 'record';
    const arch = d.status === 'archived' ? '<div class="notice">This dealer is archived. History, statistics and saved estimates stay available.</div>' : '';
    return arch + ({ record: renderRecord, history: renderHistory, stats: renderStats, predict: renderPredict, strategy: renderStrategies }[V.tab])(d);
  }

  // ----- record -----
  function hcLine(d) {
    const win = prefs.swin[d.id] ?? 'all';
    const pockets = C.windowed(spinsOf(d.id), win).map((s) => s.pocket);
    if (pockets.length < 10) return '';
    const hc = C.hotCold(pockets, wheelOf(d), 3);
    return `<button class="hc-line" data-act="tab" data-tab="stats" aria-label="Hot and cold numbers, open Stats">
      <span class="eyebrow hc-hot">Hot</span>${hc.hot.map((h) => pk(h.pocket)).join('')}
      <span class="eyebrow hc-cold">Cold</span>${hc.cold.map((h) => pk(h.pocket)).join('')}
      <span class="small muted">${win === 'all' ? 'all' : `last ${win}`}</span></button>`;
  }

  function renderRecord(d) {
    const w = wheelOf(d);
    const recent = spinsOf(d.id).slice(-30).reverse();
    const key = (p) => `<button class="key ${C.colorOf(p)}" data-act="rec" data-p="${p}" aria-label="Record ${C.label(p)}">${C.label(p)}</button>`;
    const rows = [];
    for (let n = 1; n <= 36; n++) rows.push(key(n));
    const n = spinsOf(d.id).length;
    return `<section class="card stack"><div class="spread"><span class="row"><span class="eyebrow">Last spins</span><span class="small muted num" id="rec-total">${n} total</span></span>
          <button class="btn undo-btn" data-act="undo-last" id="undo-last" ${n ? '' : 'disabled'} aria-label="Undo the last recorded spin">${ICON.undo}Undo last</button></div>
        <div class="strip" id="strip">${recent.length ? recent.map((s) => pk(s.pocket)).join('') : '<span class="muted small">No spins yet. Tap the winning pocket below.</span>'}</div>
        <div id="hc-line">${hcLine(d)}</div></section>
      <section class="card stack">
        <div class="grid2">
          <label class="f"><span>Session or table visit</span><input class="in" id="rec-session" placeholder="e.g. Sat evening" value="${esc(prefs.session[d.id] || '')}"></label>
          <label class="f"><span>Spin time</span><input class="in" id="rec-time" type="datetime-local" step="1" value="${customTime ? toLocalInput(customTime) : ''}" aria-describedby="time-help"></label>
        </div>
        <div class="small muted" id="time-help">${customTime ? `Using a fixed time. <button class="btn" style="min-height:30px;padding:2px 10px" data-act="time-now">Use current time</button>` : 'Leave the time empty to stamp each spin with the current time.'}</div>
        <div class="keypad" role="group" aria-label="${esc(w.name)} layout"><div class="zeros">${key(0)}${w.size === 38 ? key(C.DOUBLE_ZERO) : ''}</div>${rows.join('')}</div>
        <div class="row"><button class="btn" data-act="bulk">Paste past results</button><span class="small muted">${esc(w.name)}</span></div>
      </section>`;
  }

  // Refresh the Record tab in place after a tap, so the keypad keeps its scroll position.
  function refreshRecord(d) {
    const strip = $('#strip');
    if (strip) strip.innerHTML = spinsOf(d.id).slice(-30).reverse().map((x) => pk(x.pocket)).join('') || '<span class="muted small">No spins yet. Tap the winning pocket below.</span>';
    const hcl = $('#hc-line');
    if (hcl) hcl.innerHTML = hcLine(d);
    const n = spinsOf(d.id).length;
    const tot = $('#rec-total');
    if (tot) tot.textContent = `${n} total`;
    const undo = $('#undo-last');
    if (undo) undo.disabled = !n;
    $('#top').innerHTML = renderTop(); setSave(0);
  }

  // ----- history -----
  function renderHistory(d) {
    const all = C.activeSpins(allSpinsOf(d.id).filter((s) => hist.showDel || !s.del));
    const sessions = [...new Set(all.map((s) => s.session).filter(Boolean))];
    const from = hist.from ? new Date(`${hist.from}T00:00:00`).getTime() : -Infinity;
    const to = hist.to ? new Date(`${hist.to}T23:59:59.999`).getTime() : Infinity;
    let rows = all.filter((s) => s.t >= from && s.t <= to && (!hist.session || (hist.session === '__none' ? !s.session : s.session === hist.session)));
    const total = rows.length;
    if (hist.sort === 'desc') rows = rows.slice().reverse();
    rows = rows.slice(0, hist.limit);
    let lastDay = '', body = '';
    for (const s of rows) {
      const day = fmtDay(s.t);
      if (day !== lastDay) { body += `<div class="eyebrow" style="padding:12px 0 4px">${esc(day)}</div>`; lastDay = day; }
      body += `<button class="item" data-act="edit-spin" data-id="${s.id}" style="${s.del ? 'opacity:.55' : ''}">${pk(s.pocket)}<div class="grow"><div class="num small">${fmtClock(s.t)}</div>
        <div class="meta">${[s.session, s.notes].filter(Boolean).map(esc).join(' · ') || '&nbsp;'}</div></div>
        ${s.log?.length ? '<span class="badge">Edited</span>' : ''}${s.del ? '<span class="badge bad">Deleted</span>' : ''}</button>`;
    }
    return `<section class="card stack">
        <div class="chips">${[['desc', 'Newest first'], ['asc', 'Oldest first']].map(([k, l]) => `<button class="chip" data-act="hsort" data-v="${k}" aria-pressed="${hist.sort === k}">${l}</button>`).join('')}</div>
        <div class="grid2">
          <label class="f"><span>From</span><input class="in" type="date" id="h-from" value="${hist.from}"></label>
          <label class="f"><span>To</span><input class="in" type="date" id="h-to" value="${hist.to}"></label>
        </div>
        <label class="f"><span>Session</span><select class="in" id="h-session"><option value="">All sessions</option><option value="__none" ${hist.session === '__none' ? 'selected' : ''}>No session label</option>${sessions.map((x) => `<option ${hist.session === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
        <label class="row small"><input type="checkbox" id="h-del" ${hist.showDel ? 'checked' : ''}> Show deleted spins</label>
        <div class="small muted">${total.toLocaleString()} spin${total === 1 ? '' : 's'} match. Tap a spin to correct or delete it.</div>
      </section>
      <section class="card"><div class="list">${body || '<p class="muted small">No spins match these filters.</p>'}</div>
        ${total > hist.limit ? `<button class="btn block" data-act="hmore" style="margin-top:8px">Show ${Math.min(300, total - hist.limit)} more</button>` : ''}</section>`;
  }

  // ----- stats -----
  function windowChips(act, cur) {
    return `<div class="chips" role="group" aria-label="Analysis window">${WINDOWS.map((w) => `<button class="chip" data-act="${act}" data-v="${w}" aria-pressed="${String(cur) === String(w)}">${w === 'all' ? 'All spins' : `Last ${w}`}</button>`).join('')}</div>`;
  }

  function barRows(items, domain, opts = {}) {
    return items.map((it) => {
      const w = (x) => `${Math.min(100, (x / domain) * 100).toFixed(2)}%`;
      const ci = it.ci ? `<span class="ci" style="left:${w(it.ci[0])};width:calc(${w(it.ci[1])} - ${w(it.ci[0])})"></span>` : '';
      return `<div class="bar-row" data-tip="${esc(it.tip || '')}"><span class="lab">${it.labelHtml || esc(it.label)}</span>
        <span class="track"><span class="fill ${opts.alt ? 'alt' : ''}" style="width:${w(it.value)}"></span>${ci}<span class="tick ${opts.alt ? 'base' : ''}" style="left:calc(${w(it.ref)} - 1px)"></span></span>
        <span class="val"><b>${pct(it.value, opts.d ?? 1)}</b> / ${pct(it.ref, opts.d ?? 1)}</span></div>`;
    }).join('');
  }

  function hotColdCard(hc, w, win) {
    const winTxt = win === 'all' ? 'all spins' : `the last ${Math.min(win, hc.n)} spins`;
    const item = (h, kind) => {
      const flag = h.pAdj < 0.05;
      const seen = h.gap === null ? 'not seen' : h.gap === 0 ? 'last spin' : `${h.gap} spin${h.gap === 1 ? '' : 's'} ago`;
      return `<div class="hc-item${flag ? ' hc-flag' : ''}" data-tip="${esc(`${C.label(h.pocket)}: ${h.count} hits vs ${h.expected.toFixed(1)} expected in ${winTxt}; last seen ${seen}.${flag ? ' Unusual even after allowing for 37 numbers.' : ''}`)}">
        ${pk(h.pocket, 'lg')}<div class="stack" style="gap:1px;min-width:0"><b class="num">${h.count} hit${h.count === 1 ? '' : 's'}</b><span class="small muted">${esc(seen)}</span></div>
        ${flag ? `<span class="badge ${kind === 'hot' ? 'good' : 'bad'}">Unusual</span>` : ''}</div>`;
    };
    const flagged = [...hc.hot, ...hc.cold].filter((h) => h.pAdj < 0.05);
    const verdict = hc.n < 5 * w.size
      ? `<div class="verdict na"><span class="ico">i</span><div>With ${hc.n} spins each number is expected only ${hc.expected.toFixed(1)} times, so hot and cold lists mostly reflect luck. ${5 * w.size}+ spins give a fairer picture.</div></div>`
      : flagged.length
        ? `<div class="verdict flag"><span class="ico">!</span><div><b>${flagged.map((h) => C.label(h.pocket)).join(', ')} stand${flagged.length === 1 ? 's' : ''} out</b> beyond what chance usually produces across 37 numbers. Check for entry mistakes, then watch whether it holds on new spins.</div></div>`
        : `<div class="verdict ok"><span class="ico">✓</span><div><b>Within normal variation.</b> On a fair wheel some numbers always run hot or cold; none here is more extreme than chance across 37 numbers would allow.</div></div>`;
    return `<section class="card stack"><div class="spread"><h2>Hot and cold</h2><span class="small muted">this dealer · ${esc(winTxt)}</span></div>
      <p class="small muted" style="margin:0">Expected per number: <span class="num">${hc.expected.toFixed(1)}</span> hits.</p>
      <div class="hc-grid"><div class="stack" style="gap:6px"><span class="eyebrow hc-hot">Hot · most hits</span>${hc.hot.map((h) => item(h, 'hot')).join('')}</div>
        <div class="stack" style="gap:6px"><span class="eyebrow hc-cold">Cold · fewest hits</span>${hc.cold.map((h) => item(h, 'cold')).join('')}</div></div>
      ${verdict}
      <p class="small muted" style="margin:0">Hot and cold describe the past. On a fair wheel a hot number isn't more likely next and a cold one isn't "due".</p></section>`;
  }

  function renderStats(d) {
    const w = wheelOf(d);
    const win = prefs.swin[d.id] ?? 'all';
    const all = spinsOf(d.id);
    const sp = C.windowed(all, win);
    const pockets = sp.map((s) => s.pocket);
    const n = pockets.length;
    const head = `<section class="card stack"><span class="eyebrow">Observed · describes past spins only</span>${windowChips('swin', win)}</section>`;
    if (!n) return `${head}<section class="card empty"><h2>No spins yet</h2><p class="muted small">Record spins on the Record tab and the statistics appear here.</p><button class="btn primary" data-act="tab" data-tab="record">Record spins</button></section>`;
    const sessions = new Set(sp.map((s) => s.session).filter(Boolean)).size;
    const need = 5 * w.size;
    const cats = C.categoryStats(pockets, w);
    const cnt = C.counts(pockets, w.size);
    const e = n / w.size;
    const chi = C.chiSquare(cnt);
    const gaps = C.gaps(pockets, w);
    const st = C.streaks(pockets);

    const catHtml = cats.map((g) => {
      const domain = Math.min(1, Math.max(...g.items.map((i) => Math.max(i.ci[1], i.expected))) * 1.15);
      return `<div class="stack" style="gap:6px"><h3>${esc(g.label)}</h3><div class="bars">${barRows(g.items.map((i) => ({
        label: i.label, value: i.observed, ref: i.expected, ci: i.ci,
        tip: `${i.label}: ${i.count} of ${n} (${pct(i.observed)}). Fair wheel: ${pct(i.expected)}. 95% range ${pct(i.ci[0])}–${pct(i.ci[1])}.`,
      })), domain)}</div></div>`;
    }).join('');

    const cell = (p) => {
      const z = (cnt[p] - e) / Math.sqrt(e);
      const m = Math.round(Math.min(1, Math.abs(z) / 3) * 70);
      const bg = `color-mix(in oklab, var(${z >= 0 ? '--above' : '--below'}) ${m}%, var(--mid))`;
      const tip = `${C.label(p)}: ${cnt[p]} hit${cnt[p] === 1 ? '' : 's'} (expected ${e.toFixed(1)}). ${gaps[p] === null ? 'Not seen in this window.' : `Last seen ${gaps[p]} spin${gaps[p] === 1 ? '' : 's'} ago.`}`;
      return `<button class="cell" style="background:${bg}" data-tip="${esc(tip)}" aria-label="${esc(tip)}"><span class="dot" style="background:var(--pocket-${C.colorOf(p)})"></span><span class="n">${C.label(p)}</span><span class="c">${cnt[p]}</span></button>`;
    };
    const heat = `<div class="heat"><div class="zeros">${cell(0)}${w.size === 38 ? cell(C.DOUBLE_ZERO) : ''}</div>${Array.from({ length: 36 }, (_, i) => cell(i + 1)).join('')}</div>`;

    let verdict;
    if (!chi.valid) verdict = `<div class="verdict na"><span class="ico">i</span><div>Not enough spins for a pocket-level test yet: it needs at least ${need} (5 expected per pocket). This window has ${n}.</div></div>`;
    else if (chi.p < 0.01) verdict = `<div class="verdict flag"><span class="ico">!</span><div><b>Unusual for a fair wheel</b> (χ² ${chi.stat.toFixed(1)}, df ${chi.df}, p = ${chi.p.toPrecision(2)}). Check for entry mistakes first. Testing many dealers and windows will also turn up some unusual results by chance.</div></div>`;
    else verdict = `<div class="verdict ok"><span class="ico">✓</span><div><b>Consistent with a fair wheel</b> (χ² ${chi.stat.toFixed(1)}, df ${chi.df}, p = ${chi.p.toFixed(2)}). The spread of pocket counts is within what chance alone produces.</div></div>`;

    const absent = w.pockets.map((p) => ({ p, g: gaps[p] })).sort((a, b) => (b.g ?? Infinity) - (a.g ?? Infinity)).slice(0, 8);
    const streakRow = (lab, r) => `<tr><td>${lab}</td><td>${r.current ? `${esc(r.current)} <span class="num">×${r.currentLen}</span>` : '–'}</td><td>${r.longest ? `${esc(r.longest)} <span class="num">×${r.longestLen}</span>` : '–'}</td></tr>`;

    let compare = '';
    if (win !== 'all' && all.length >= 2 * win) {
      const prev = all.slice(-2 * win, -win).map((s) => s.pocket);
      const pc = C.categoryStats(prev, w);
      const rows = cats.filter((g) => g.key !== 'column').flatMap((g, gi) => g.items.map((it, ii) => {
        const before = pc.find((x) => x.key === g.key).items[ii];
        return `<tr><td>${esc(it.label)}</td><td class="r">${pct(before.observed)}</td><td class="r">${pct(it.observed)}</td><td class="r">${pct(it.expected)}</td></tr>`;
      }));
      compare = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bet</th><th class="r">Prev ${win}</th><th class="r">Last ${win}</th><th class="r">Fair</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
    } else {
      compare = `<p class="small muted" style="margin:0">${win === 'all' ? 'Pick a window (for example Last 100) to compare it with the window before it.' : `Needs ${2 * win} spins to compare two windows of ${win}; this dealer has ${all.length}.`}</p>`;
    }

    return `${head}
      <section class="card stack">
        <div class="tiles"><div class="tile"><b class="num">${n.toLocaleString()}</b><span>spins${win !== 'all' ? ` of ${all.length.toLocaleString()}` : ''}</span></div>
          <div class="tile"><b class="num">${sessions}</b><span>sessions</span></div>
          <div class="tile"><b class="num">${((sp[n - 1].t - sp[0].t) / 864e5).toFixed(1)}</b><span>days covered</span></div></div>
        <div class="small muted">${esc(fmtDT(sp[0].t))} → ${esc(fmtDT(sp[n - 1].t))}</div>
        <div class="stack" style="gap:4px"><div class="spread small"><span>Sample for pocket-level analysis</span><span class="num">${Math.min(n, need)}/${need}</span></div><div class="meter"><i style="width:${Math.min(100, (n / need) * 100)}%"></i></div></div>
      </section>
      ${hotColdCard(C.hotCold(pockets, w), w, win)}
      <section class="card stack"><div class="spread"><h2>Recent results</h2><span class="small muted">newest first</span></div><div class="strip">${sp.slice(-30).reverse().map((s) => pk(s.pocket)).join('')}</div></section>
      <section class="card stack"><h2>Outside bets</h2><p class="small muted" style="margin:0">Bar = observed share, whisker = 95% range for that share, gold tick = fair-wheel expectation.</p>${catHtml}</section>
      <section class="card stack"><h2>Pocket counts</h2>
        <p class="small muted" style="margin:0">Counts per pocket in this window, laid out like the betting table. Expected per pocket: <span class="num">${e.toFixed(1)}</span>. Tap a pocket for detail.</p>
        ${heat}
        <div class="stack" style="gap:3px"><div class="legend-ramp"></div><div class="spread small muted"><span>Fewer than expected</span><span>As expected</span><span>More</span></div></div>
        ${verdict}
      </section>
      <section class="card stack"><h2>Streaks</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bet</th><th>Current</th><th>Longest</th></tr></thead><tbody>
          ${streakRow('Colour', st.color)}${streakRow('Odd / even', st.parity)}${streakRow('Low / high', st.range)}${streakRow('Dozen', st.dozen)}</tbody></table></div>
        <p class="small muted" style="margin:0">Same pocket twice in a row: <span class="num">${st.repeats}</span> times (about <span class="num">${((n - 1) / w.size).toFixed(1)}</span> expected by chance).</p>
      </section>
      <section class="card stack"><h2>Longest absent</h2>
        <div class="row">${absent.map((a) => `<span class="row" style="gap:5px">${pk(a.p)}<span class="small num">${a.g === null ? 'not seen' : `${a.g} spins`}</span></span>`).join('')}</div>
        <p class="small muted" style="margin:0">A pocket that hasn't appeared for a while is not "due". On a fair wheel its chance on the next spin is unchanged.</p>
      </section>
      <section class="card stack"><h2>Window comparison</h2>${compare}</section>`;
  }

  // Parameters for the selected model, as passed to Core.predict / Core.backtest.
  const HALF_LIVES = [10, 25, 50, 100, 250];
  const modelParams = () => ({ alpha: prefs.alpha, halfLife: prefs.halfLife || C.DEFAULT_HALF_LIFE });
  const paramText = (model, params) => model === 'weighted' ? ` · half-life ${params.halfLife} · α=${params.alpha}` : model === 'smoothed' ? ` · α=${params.alpha}` : '';

  // ----- suggested bet -----
  const BET_OPTS = [
    { key: 'n5', mode: 'neighbours', k: 5, label: 'Neighbours (5)' },
    { key: 't3', mode: 'top', k: 3, label: 'Top 3' },
    { key: 't5', mode: 'top', k: 5, label: 'Top 5' },
    { key: 'a7', mode: 'arc', k: 7, label: 'Best 7 on wheel' },
    { key: 'a9', mode: 'arc', k: 9, label: 'Best 9 on wheel' },
    { key: 'a12', mode: 'arc', k: 12, label: 'Best 12 on wheel' },
  ];
  const betOpt = () => BET_OPTS.find((o) => o.key === prefs.sector) || BET_OPTS[0];
  const money = (x, sign = true) => {
    const v = Math.abs(x) < 0.005 ? 0 : x;
    const t = Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return sign ? (v > 0 ? '+' : v < 0 ? '−' : '') + t : t;
  };
  const tablePos = (p) => (p === C.DOUBLE_ZERO ? -1 : p);
  const POCKET_FILL = { red: 'var(--pocket-red)', black: 'var(--pocket-black)', green: 'var(--pocket-green)' };

  // The wheel as seen from above, sector lit and everything else dimmed.
  function wheelSvg(w, sector, pickP) {
    const order = C.WHEEL_ORDER[w.type], N = order.length, step = 360 / N;
    const on = new Set(sector.pockets);
    const R = 138, r = 96, rad = (deg) => (deg * Math.PI) / 180;
    const pt = (rr, deg) => `${(rr * Math.sin(rad(deg))).toFixed(2)} ${(-rr * Math.cos(rad(deg))).toFixed(2)}`;
    const segs = order.map((p, i) => {
      const a0 = i * step - step / 2, a1 = a0 + step, lit = on.has(p) || p === pickP;
      return `<g opacity="${lit ? 1 : 0.22}"><path d="M${pt(r, a0)} L${pt(R, a0)} A${R} ${R} 0 0 1 ${pt(R, a1)} L${pt(r, a1)} A${r} ${r} 0 0 0 ${pt(r, a0)}Z" fill="${POCKET_FILL[C.colorOf(p)]}" stroke="var(--surface)" stroke-width="1"/>
        <text transform="rotate(${(i * step).toFixed(2)}) translate(0 ${-(R + r) / 2 - 4})" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="${p === pickP ? 14 : 11.5}" font-weight="600" font-family="var(--f-display)">${C.label(p)}</text></g>`;
    }).join('');
    let arc;
    if (sector.contiguous) {
      const i0 = order.indexOf(sector.pockets[0]);
      const a0 = i0 * step - step / 2, a1 = a0 + sector.pockets.length * step;
      arc = `<path d="M${pt(R + 7, a0)} A${R + 7} ${R + 7} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${pt(R + 7, a1)}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>`;
    } else {
      arc = sector.pockets.map((p) => { const a = order.indexOf(p) * step; return `<path d="M${pt(R + 7, a - step / 2 + 1)} A${R + 7} ${R + 7} 0 0 1 ${pt(R + 7, a + step / 2 - 1)}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>`; }).join('');
    }
    const ip = order.indexOf(pickP), pa = ip * step;
    const pickRing = `<path d="M${pt(r, pa - step / 2)} L${pt(R, pa - step / 2)} A${R} ${R} 0 0 1 ${pt(R, pa + step / 2)} L${pt(r, pa + step / 2)} A${r} ${r} 0 0 0 ${pt(r, pa - step / 2)}Z" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
      <path d="M${pt(R + 22, pa - 3.2)} L${pt(R + 12, pa)} L${pt(R + 22, pa + 3.2)}Z" fill="var(--accent)"/>`;
    return `<svg class="wheel-big" viewBox="-165 -165 330 330" role="img" aria-label="Wheel with sector ${sector.pockets.map(C.label).join(', ')} highlighted and ${C.label(pickP)} marked as the pick">
      <circle r="${R + 2}" fill="var(--surface-2)"/>${segs}${arc}${pickRing}
      <circle r="${r - 1}" fill="var(--surface-2)"/><circle r="${r - 14}" fill="var(--surface)" stroke="var(--line)"/>
      <text y="-22" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="var(--f-body)" letter-spacing="1.5">PICK</text>
      <text y="22" text-anchor="middle" fill="var(--fg)" font-size="56" font-weight="600" font-family="var(--f-display)">${C.label(pickP)}</text></svg>`;
  }

  // Betting-table layout (zero column, then 12 columns of 3) with the sector lit and chips placed.
  const CHIP_TAGS = 'ABCDEFGHIJKL';
  // opts.full adds the outside bets (dozens, even-money boxes, columns); opts.tag labels each chip.
  function tableMini(w, sector, pickP, place, opts = {}) {
    const Z = 30, CW = 26, RH = 30, H = 3 * RH, OH = 24, on = new Set(sector.pockets), us = w.size === 38, full = !!opts.full;
    const tag = opts.tag || ((b, i) => CHIP_TAGS[i]);
    const X1 = Z + 12 * CW;
    // Outside boxes: columns to the right of each row, dozens under the numbers, then the even-money row.
    const EVEN_ROW = ['low', 'even', 'red', 'black', 'odd', 'high'];
    const obox = (k) => {
      if (/^c\d$/.test(k)) return [X1, (3 - Number(k[1])) * RH, CW, RH];
      if (/^d\d$/.test(k)) return [Z + (Number(k[1]) - 1) * 4 * CW, H, 4 * CW, OH];
      return [Z + EVEN_ROW.indexOf(k) * 2 * CW, H + OH, 2 * CW, OH];
    };
    const usedOut = new Set(place.filter((b) => b.kind === 'outside').map((b) => b.key));
    const OLABEL = { low: '1–18', even: 'EVEN', red: '◆', black: '◆', odd: 'ODD', high: '19–36', d1: '1st 12', d2: '2nd 12', d3: '3rd 12', c1: '2:1', c2: '2:1', c3: '2:1' };
    const outside = full ? Object.keys(OLABEL).map((k) => {
      const [x, y, bw, bh] = obox(k), lit = usedOut.has(k);
      const ink = k === 'red' ? 'var(--pocket-red)' : k === 'black' ? 'var(--fg)' : 'var(--muted)';
      return `<g opacity="${lit ? 1 : 0.55}"><rect x="${x + 1}" y="${y + 1}" width="${bw - 2}" height="${bh - 2}" rx="3" fill="var(--surface-2)" stroke="${lit ? 'var(--accent)' : 'var(--line)'}" stroke-width="${lit ? 1.5 : 1}"/>
        <text x="${x + bw / 2 - (lit && bw > CW ? 8 : 0)}" y="${y + bh / 2}" text-anchor="middle" dominant-baseline="central" fill="${ink}" font-size="${k === 'red' || k === 'black' ? 14 : 10.5}" font-weight="600" font-family="var(--f-body)">${OLABEL[k]}</text></g>`;
    }).join('') : '';
    const box = (p) => {
      if (p === 0) return us ? [0, H / 2, Z, H / 2] : [0, 0, Z, H];
      if (p === C.DOUBLE_ZERO) return [0, 0, Z, H / 2];
      const c = Math.floor((p - 1) / 3), r = 2 - ((p - 1) % 3);
      return [Z + c * CW, r * RH, CW, RH];
    };
    const ctr = (p) => { const [x, y, bw, bh] = box(p); return [x + bw / 2, y + bh / 2]; };
    const solo = new Set(place.filter((b) => b.kind === 'straight').map((b) => b.pockets[0]));
    const cell = (p) => {
      const [x, y, bw, bh] = box(p), lit = on.has(p) || p === pickP, ty = solo.has(p) ? Math.min(y + 9, y + bh / 2 - 6) : y + bh / 2;
      return `<g opacity="${lit ? 1 : 0.2}"><rect x="${x + 1}" y="${y + 1}" width="${bw - 2}" height="${bh - 2}" rx="3" fill="${POCKET_FILL[C.colorOf(p)]}"${p === pickP ? ' stroke="var(--accent)" stroke-width="2.5"' : ''}/>
        <text x="${x + bw / 2}" y="${ty}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="12.5" font-weight="600" font-family="var(--f-display)">${C.label(p)}</text></g>`;
    };
    // Where the dealer expects each chip: on the shared line, corner or outer edge of its numbers.
    const spot = (b) => {
      const ps = b.pockets;
      if (b.kind === 'outside') { const [x, y, bw, bh] = obox(b.key); return [bw > CW ? x + bw - 12 : x + bw / 2, y + bh / 2]; }
      if (ps.includes(0) || ps.includes(C.DOUBLE_ZERO)) {
        const nums = ps.filter((p) => !C.isZero(p));
        if (!nums.length) return [Z / 2, H / 2];
        const y = nums.reduce((a, p) => a + ctr(p)[1], 0) / nums.length;
        if (!us || nums.length > 1 || ps.length > 2) return [Z, y];
        return [Z, y + (ps.includes(0) ? 1 : -1) * (nums[0] === 2 ? 8 : 0)];
      }
      if (b.kind === 'straight') { const [x, y, , bh] = box(ps[0]); return [x + box(ps[0])[2] / 2, Math.max(y + 21, y + bh / 2 + 7)]; }
      if (b.kind === 'street' || b.kind === 'six line') return [ps.reduce((a, p) => a + ctr(p)[0], 0) / ps.length, H];
      return ps.reduce(([ax, ay], p) => { const [x, y] = ctr(p); return [ax + x / ps.length, ay + y / ps.length]; }, [0, 0]);
    };
    const chips = place.map((b, i) => {
      const [x, y] = spot(b), r = b.kind === 'straight' ? 7.5 : 8.5;
      return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r - 3}" fill="none" stroke="var(--surface)" stroke-width="1" stroke-dasharray="2 1.6" opacity=".8"/>
        <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="var(--surface)" font-size="${r > 8 ? 9 : 8}" font-weight="700" font-family="var(--f-body)">${tag(b, i)}</text></g>`;
    }).join('');
    return `<div class="tbl-wrap"><svg class="tmini" viewBox="-2 -2 ${(full ? X1 + CW : X1) + 4} ${(full ? H + 2 * OH : H + 9) + 4}" role="img" aria-label="${esc(opts.label || `Betting table with the suggested numbers lit and ${place.length} chip placement${place.length === 1 ? '' : 's'} marked`)}">
      ${w.pockets.map(cell).join('')}${outside}${chips}</svg></div>`;
  }

  function renderPick(d, w, probs, pockets, win, all) {
    const opt = betOpt(), k = opt.k;
    const stake = prefs.stake > 0 ? prefs.stake : 10;
    const pk0 = prefs.model === 'baseline' || !pockets.length ? null : C.pick(probs, pockets, w);
    const head = `<div class="spread"><h2>Suggested bet</h2><span class="badge">Not a guarantee</span></div>`;
    if (!pk0) {
      return `<section class="card stack">${head}<div class="verdict na"><span class="ico">i</span><div>${prefs.model === 'baseline'
        ? 'The baseline gives every pocket the same chance, so it has no pick. Choose Historical or Smoothed frequency above.'
        : pockets.length ? 'Every pocket has the same count in this window, so there is no pick yet.' : 'Record spins for this dealer to get a pick.'}</div></div></section>`;
    }
    const sec = C.bestSector(probs, w, k, pk0.pocket, opt.mode, C.gaps(pockets, w));
    const cnt = C.counts(pockets, w.size);
    const weighted = prefs.model === 'weighted';
    const bt = C.pickBacktest(all.map((s) => s.pocket), w, win, k, 20, opt.mode, weighted ? modelParams().halfLife : null);
    const wcount = weighted ? C.weightedCounts(pockets, w.size, modelParams().halfLife).c[pk0.pocket] : null;
    const e1 = C.betEconomics(1, stake, pk0.p), eK = C.betEconomics(k, stake, sec.p);
    const f1 = C.betEconomics(1, stake, 1 / w.size), fK = C.betEconomics(k, stake, k / w.size);
    const secName = opt.mode === 'neighbours' ? 'Neighbours' : opt.mode === 'top' ? `Top ${k}` : `Best ${k}`;
    const pastPick = bt.pickHits * e1.back - bt.scored * e1.cost, pastK = bt.sectorHits * eK.back - bt.scored * eK.cost;
    const evCell = (x) => `<td class="r" style="color:${x < 0 ? 'var(--bad)' : x > 0 ? 'var(--good)' : 'inherit'}">${money(x)}</td>`;
    const KIND = { straight: 'Straight up', split: 'Split', trio: 'Trio', street: 'Street', corner: 'Corner', 'six line': 'Six line' };
    const place = C.betPlacement(sec.pockets, w).sort((a, b) => Math.min(...a.pockets.map(tablePos)) - Math.min(...b.pockets.map(tablePos)));
    // One chip of `stake` per placement, so what comes back depends on which bet the number sits in.
    const backOf = (b) => (b.pays + 1) * stake;
    const placeCost = place.length * stake, leastBack = Math.min(...place.map(backOf)), mostBack = Math.max(...place.map(backOf));
    const placeHtml = `<div class="tbl-wrap"><table class="tbl place"><thead><tr><th>Chip</th><th>Bet</th><th class="r">Stake</th><th class="r">Back if hit</th></tr></thead><tbody>
        ${place.map((b, i) => `<tr><td><span class="ctag">${CHIP_TAGS[i]}</span></td><td>${KIND[b.kind]} <span class="muted">${b.pockets.slice().sort((x, y) => tablePos(x) - tablePos(y)).map(C.label).join(' · ')}</span><br><span class="small muted">${b.pays} to 1</span></td>
          <td class="r num">${money(stake, false)}</td><td class="r num">${money(backOf(b), false)}</td></tr>`).join('')}
        <tr class="tot"><td></td><td>${place.length} chip${place.length === 1 ? '' : 's'} on the felt</td><td class="r num">${money(placeCost, false)}</td><td class="r num">${leastBack < mostBack ? 'at least ' : ''}${money(leastBack, false)}</td></tr></tbody></table></div>
      <p class="small muted" style="margin:0">${place.length < k
        ? `Grouping neighbouring numbers on the layout into ${[...new Set(place.filter((b) => b.stakes > 1).map((b) => KIND[b.kind].toLowerCase() + 's'))].join(', ')} puts ${place.length} chips down instead of ${k}. `
        : `These numbers don't sit next to each other on the layout, so each needs its own straight-up chip. `}One ${money(stake, false)} chip per placement. ${leastBack < mostBack
        ? `A hit pays back between ${money(leastBack, false)} and ${money(mostBack, false)} depending on which bet covers the number; the least is ${money(leastBack, false)}, ${money(leastBack - placeCost)} after the ${money(placeCost, false)} staked.`
        : `Any hit pays back ${money(leastBack, false)}, ${money(leastBack - placeCost)} after the ${money(placeCost, false)} staked.`}${place.length < k
        ? ` The cost and payout table below assumes one chip on each number straight up instead.` : ''}${opt.mode === 'neighbours'
        ? ` At a European table you can also hand the dealer ${k} chips and call "${C.label(pk0.pocket)} and the neighbours".` : ''}</p>`;
    const costHtml = `<div class="stack" style="gap:8px">
        <label class="f" style="max-width:220px"><span>Chip per number</span><input class="in num" id="stake" type="number" min="0.01" step="any" inputmode="decimal" value="${stake}"></label>
        <div class="tbl-wrap"><table class="tbl money"><thead><tr><th></th><th class="r">Pick ${C.label(pk0.pocket)}</th><th class="r">${secName} (${k})</th></tr></thead><tbody>
          <tr><td>Cost per spin</td><td class="r">${money(e1.cost, false)}</td><td class="r">${money(eK.cost, false)}</td></tr>
          <tr><td>Paid back if it hits</td><td class="r">${money(e1.back, false)}</td><td class="r">${money(eK.back, false)}</td></tr>
          <tr><td>Profit if it hits</td>${evCell(e1.winProfit)}${evCell(eK.winProfit)}</tr>
          <tr><td>Loss if it misses</td>${evCell(e1.lossIfMiss)}${evCell(eK.lossIfMiss)}</tr>
          <tr><td>Chance it hits, model</td><td class="r">${pct(pk0.p)}</td><td class="r">${pct(sec.p)}</td></tr>
          <tr><td>Chance it hits, fair wheel</td><td class="r">${pct(1 / w.size)}</td><td class="r">${pct(k / w.size)}</td></tr>
          <tr><td>Expected per spin, fair wheel</td>${evCell(f1.ev)}${evCell(fK.ev)}</tr>
          <tr><td>Expected per spin, if model is right</td>${evCell(e1.ev)}${evCell(eK.ev)}</tr>
          ${bt.scored >= 30 ? `<tr><td>Result replaying ${bt.scored} past spins</td>${evCell(pastPick)}${evCell(pastK)}</tr>` : ''}
        </tbody></table></div>
        <p class="small muted" style="margin:0">One chip on each number, straight up, paid 35 to 1 (your chip comes back too). Only one number can hit per spin. On a fair ${w.size === 38 ? 'American' : 'European'} wheel every straight-up bet loses ${pct(1 / w.size, 2)} of the amount staked on average; the "if model is right" line only holds if the estimate is real, which the track record tests.</p></div>`;
    let record;
    if (bt.scored < 30) record = `<div class="verdict na"><span class="ico">i</span><div>Track record needs at least 50 spins for this dealer; there are ${all.length}.</div></div>`;
    else {
      const flag = bt.sectorP < 0.01 || bt.pickP < 0.01;
      record = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Following this rule</th><th class="r">Hits</th><th class="r">Hit rate</th><th class="r">Chance</th></tr></thead><tbody>
          <tr><td>Bet the pick</td><td class="r">${bt.pickHits}/${bt.scored}</td><td class="r">${pct(bt.pickRate)}</td><td class="r">${pct(bt.pickBase)}</td></tr>
          <tr><td>Bet ${secName.toLowerCase()} (${k})</td><td class="r">${bt.sectorHits}/${bt.scored}</td><td class="r">${pct(bt.sectorRate)}</td><td class="r">${pct(bt.sectorBase)}</td></tr></tbody></table></div>
        ${flag
          ? `<div class="verdict flag"><span class="ico">!</span><div><b>Hit more often than chance</b> on this dealer's past spins (p = ${Math.min(bt.pickP, bt.sectorP).toPrecision(2)}). Re-test on new spins before trusting it.</div></div>`
          : `<div class="verdict ok"><span class="ico">✓</span><div><b>In line with chance.</b> Replaying ${bt.scored} past spins, choosing numbers this way hit about as often as random numbers would.</div></div>`}`;
    }
    return `<section class="card stack pick-card">${head}
      <div class="pick-hero">${pk(pk0.pocket, 'xl')}<div class="stack" style="gap:2px;min-width:0">
        <span class="eyebrow">Single number · ${money(stake, false)} chip pays ${money(35 * stake, false)}</span>
        <span><b class="num">${pct(pk0.p, 2)}</b> estimate vs <span class="num">${pct(1 / w.size, 2)}</span> fair</span>
        <span class="small muted">Seen ${cnt[pk0.pocket]} times in ${win === 'all' ? 'all' : `the last ${win}`} spins${weighted ? ` · recency-weighted score ${wcount.toFixed(1)}` : ''}${pk0.tied > 1 ? `; tied with ${pk0.tied - 1} other${pk0.tied > 2 ? 's' : ''}, picked the most recent` : ''}.</span></div></div>
      <div class="stack" style="gap:6px"><span class="eyebrow">Multi-number bet</span>
        <div class="chips" role="group" aria-label="Multi-number bet">${BET_OPTS.map((o) => `<button class="chip" data-act="sector" data-v="${o.key}" aria-pressed="${opt.key === o.key}">${o.label}</button>`).join('')}</div></div>
      ${wheelSvg(w, sec, pk0.pocket)}
      <div class="stack" style="gap:6px"><span class="eyebrow">${opt.mode === 'neighbours' ? `Neighbours bet · ${C.label(pk0.pocket)} and 2 either side, in wheel order` : opt.mode === 'top' ? `Top ${k} numbers by estimate, best first` : `Strongest ${k}-pocket stretch of the wheel, in wheel order`}</span>
        <div class="row sector-row">${sec.pockets.map((p) => pk(p, p === pk0.pocket ? 'lg is-pick' : 'lg')).join('')}</div>
        <span class="small">Covers ${k} of ${w.size} pockets: <b class="num">${pct(sec.p)}</b> estimate vs <span class="num">${pct(sec.base)}</span> fair.${sec.hasPick ? '' : ' The pick sits outside this stretch.'}</span></div>
      <div class="stack" style="gap:6px"><span class="eyebrow">On the table · where to place the chips</span>${tableMini(w, sec, pk0.pocket, place)}${placeHtml}</div>
      <div class="stack" style="gap:6px"><span class="eyebrow">Cost and payout</span>${costHtml}</div>
      <div class="stack" style="gap:6px"><span class="eyebrow">Track record on this dealer</span>${record}</div>
    </section>`;
  }

  // ----- strategies -----
  // Running result over the replay: one line against the start level, with hover bands for readouts.
  function bankrollSpark(path, start, stake, bustAt) {
    const W = 300, H = 64, n = path.length - 1, lo = Math.min(0, ...path), hi = Math.max(start * 1.05, ...path);
    const x = (i) => (n ? (i / n) * W : 0), y = (v) => H - 4 - ((v - lo) / (hi - lo || 1)) * (H - 8);
    const d = path.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
    const bands = Math.min(n, 60), hit = [];
    for (let b = 0; b < bands; b++) {
      const i = Math.round(((b + 1) / bands) * n);
      hit.push(`<rect x="${x(Math.round((b / bands) * n)).toFixed(1)}" y="0" width="${(W / bands).toFixed(1)}" height="${H}" fill="transparent" data-tip="After spin ${i}: ${money((path[i] - start) * stake)}"/>`);
    }
    const end = path[n];
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Running result from ${money(start * stake)} to ${money(end * stake)} over ${n} spins">
      <line x1="0" x2="${W}" y1="${y(start)}" y2="${y(start)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
      <path d="${d}" fill="none" stroke="${end >= start ? 'var(--good)' : 'var(--bad)'}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${bustAt !== null ? `<circle cx="${x(n)}" cy="${y(end)}" r="4" fill="var(--bad)" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/>` : ''}${hit.join('')}</svg>`;
  }

  const pfText = (x) => (Number.isFinite(x) ? x.toFixed(2) : Number.isNaN(x) ? '–' : '∞');
  const BET_NAME = { straight: 'Straight up', split: 'Split', trio: 'Trio', street: 'Street', corner: 'Corner', 'six line': 'Six line' };
  const betLabel = (b) => (b.kind === 'outside' ? C.OUTSIDE[b.key].label : `${BET_NAME[b.kind]} ${b.pockets.map(C.label).join('/')}`);

  function renderStrategies(d) {
    const w = wheelOf(d);
    const win = prefs.twin[d.id] ?? 'all';
    const pockets = C.windowed(spinsOf(d.id), win).map((s) => s.pocket);
    const n = pockets.length, stake = prefs.stake > 0 ? prefs.stake : 10;
    const bankroll = prefs.bankroll > 0 ? prefs.bankroll : Infinity;
    const edge = w.size === 38 ? 2 / 38 : 1 / 37;
    const chipRow = (act, cur, vals, label) => `<div class="chips" role="group" aria-label="${label}">${vals.map(([v, l]) => `<button class="chip" data-act="${act}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
    const head = `<section class="card stack"><div class="spread"><h2>Placement strategies</h2><span class="badge">Replay, not a forecast</span></div>
      <p class="small muted" style="margin:0">Standard ways of spreading chips over the table, each staked the same every spin and replayed over this dealer's recorded spins, oldest first.${w.size === 38 ? ' The announced bets (Voisins, Tiers, Orphelins, Jeu Zéro) follow the European wheel, so they are left out for this American wheel.' : ''}</p>
      ${windowChips('twin', win)}
      <div class="grid2">
        <label class="f"><span>Chip value</span><input class="in num" id="stake" type="number" min="0.01" step="any" inputmode="decimal" value="${stake}"></label>
        <div class="stack" style="gap:6px"><span class="eyebrow">Bankroll</span>${chipRow('bankroll', prefs.bankroll > 0 ? prefs.bankroll : 0, [[0, 'No limit'], ...[100, 250, 500].map((u) => [u, money(u * stake, false)])], 'Bankroll')}</div>
      </div></section>`;
    if (n < 10) return `${head}<section class="card empty"><h2>Not enough spins</h2><p class="muted small">Record at least 10 spins for this dealer to replay the strategies.</p><button class="btn primary" data-act="tab" data-tab="record">Record spins</button></section>`;

    const rows = C.placementsFor(w).map((sys) => {
      const pn = C.placementNet(sys, w), r = C.simulatePlacement(pockets, pn, bankroll), b = C.placementBenchmark(n, w, pn, bankroll);
      return { sys, pn, r, b, beat: b.nets.filter((x) => x < r.net).length / b.sims };
    });
    const col = (x) => (x > 0 ? 'var(--good)' : x < 0 ? 'var(--bad)' : 'inherit');
    const summary = `<section class="card stack"><div class="spread"><h2>Profit factor</h2><span class="small muted">${n} spins · chip ${money(stake, false)}</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Strategy</th><th class="r">Net</th><th class="r">Profit factor</th><th class="r">Fair</th></tr></thead><tbody>
        ${rows.map(({ sys, pn, r }) => `<tr><td>${esc(sys.name)}${r.bustAt !== null ? ' <span class="badge bad">Bust</span>' : ''}</td><td class="r num" style="color:${col(r.net)}">${money(r.net * stake)}</td>
          <td class="r num"><b>${pfText(r.pf)}</b></td><td class="r num muted">${pfText(pn.fairPf)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin:0"><b>Profit factor</b> = total won on winning spins ÷ total lost on losing spins. Above 1.00 the spread made money on these spins; below 1.00 it lost. <b>Fair</b> is its long-run profit factor on a fair wheel.</p></section>`;

    const cards = rows.map(({ sys, pn, r, b, beat }) => {
      const flag = beat >= 0.95;
      // Group numbers by what they pay, best first.
      const byNet = new Map();
      w.pockets.forEach((p) => byNet.set(pn.net[p], [...(byNet.get(pn.net[p]) || []), p]));
      const outcomes = [...byNet.entries()].sort((x, y) => y[0] - x[0]).map(([v, ps]) => `<tr><td class="num" style="color:${col(v)}">${money(v * stake)}</td><td class="r num">${ps.length}</td><td class="r num">${pct(ps.length / w.size)}</td></tr>`).join('');
      const stat = (l, v, c) => `<div class="kv"><span class="small muted">${l}</span><b class="num"${c ? ` style="color:${c}"` : ''}>${v}</b></div>`;
      const hitRate = r.played ? r.wins / r.played : NaN, fairHit = pn.net.filter((x) => x > 0).length / w.size;
      return `<section class="card stack strat-card"><div class="spread"><h2>${esc(sys.name)}</h2><span class="badge${r.pf > 1 ? ' good' : r.pf < 1 ? ' bad' : ''}">PF ${pfText(r.pf)}</span></div>
        <p class="small muted" style="margin:0">${esc(sys.desc)}</p>
        ${tableMini(w, { pockets: w.pockets.filter((p) => sys.bets.some((x) => x.pockets.includes(p))) }, null, sys.bets, { full: true, tag: (x) => x.chips, label: `${sys.name} on the betting table: ${sys.bets.map((x) => `${x.chips} on ${betLabel(x)}`).join(', ')}` })}
        <span class="small muted">Numbers on chips = chips on that spot. ${pn.cost} chip${pn.cost === 1 ? '' : 's'} (${money(pn.cost * stake, false)}) every spin; ${pn.covered} of ${w.size} numbers pay something.</span>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>If the ball lands on…</th><th class="r">Numbers</th><th class="r">Chance</th></tr></thead><tbody>${outcomes}</tbody></table></div>
        <span class="eyebrow">Replay on this dealer</span>
        ${bankrollSpark(r.path, 0, stake, r.bustAt)}
        <span class="small muted">Running result over ${r.played} spins · dashed line = break-even</span>
        <div class="kv-grid">
          ${stat('Net result', money(r.net * stake), col(r.net))}${stat('Profit factor', pfText(r.pf))}
          ${stat('Winning spins', `${r.wins} of ${r.played} (${pct(hitRate)})`)}${stat('Fair chance', pct(fairHit))}
          ${stat('Max drawdown', money(r.maxDD * stake, false))}${stat('Total staked', money(r.wagered * stake, false))}
        </div>
        <p class="small" style="margin:0">${r.bustAt !== null ? `<b style="color:var(--bad)">Bankroll ran out after ${r.played} of ${n} spins.</b> ` : ''}Expected on a fair wheel: <span class="num">${money(-edge * r.wagered * stake)}</span> (${pct(edge, 2)} of the amount staked).</p>
        <div class="verdict ${flag ? 'flag' : 'na'}"><span class="ico">${flag ? '!' : 'i'}</span><div>${flag
          ? `<b>Did better than ${pct(beat, 0)} of ${b.sims} random runs.</b> Unusual for a fair wheel; re-check on new spins before reading anything into it.`
          : `Did better than ${pct(beat, 0)} of ${b.sims} random fair-wheel runs of ${n} spins. On random spins this spread ends ahead ${pct(b.profitable, 0)} of the time${b.bustRate ? ` and runs out of money ${pct(b.bustRate, 0)} of the time` : ''}.`}</div></div></section>`;
    }).join('');

    return head + summary + cards + `<section class="card stack"><h2>About these strategies</h2>
      <p class="small" style="margin:0">Every chip on a ${w.size === 38 ? 'American' : 'European'} table loses ${pct(edge, 2)} of its value on average, wherever it is placed, so no spread changes the house edge. Spreads only change the shape of the results: wide ones like Romanosky and James Bond win often but small and lose big when they miss; narrow ones like Jeu Zéro and Orphelins miss often and win big. A profit factor above 1 on past spins is luck unless it clearly beats the random runs and keeps doing so on new spins.</p>
      <p class="small muted" style="margin:0">Voisins, Tiers, Orphelins and Jeu Zéro can usually be called to the dealer at European tables. Zero loses every outside bet (no la partage).</p></section>`;
  }

  // ----- predict -----
  function renderPredict(d) {
    const w = wheelOf(d);
    const win = prefs.pwin[d.id] ?? 100;
    const model = prefs.model;
    const params = modelParams();
    const alpha = params.alpha;
    const all = spinsOf(d.id);
    const sp = C.windowed(all, win);
    const pockets = sp.map((s) => s.pocket);
    const n = pockets.length;
    const probs = C.predict(model, pockets, w, params);
    const base = 1 / w.size;
    const cnt = C.counts(pockets, w.size);
    // Uncertainty: for the weighted model, scale weighted hits to the effective sample size.
    const wcs = model === 'weighted' ? C.weightedCounts(pockets, w.size, params.halfLife) : null;
    const ci = (p) => (wcs ? C.wilson((wcs.c[p] * wcs.nEff) / wcs.S, wcs.nEff) : C.wilson(cnt[p], n));
    const order = w.pockets.slice().sort((a, b) => probs[b] - probs[a] || a - b);
    const top = order.slice(0, 10);
    const modelInfo = C.MODELS.find((m) => m.id === model);
    const domain = Math.max(base, ...top.map((p) => Math.max(probs[p], n ? ci(p)[1] : 0))) * 1.12;

    const pocketBars = model === 'baseline'
      ? `<p class="small" style="margin:0">Every pocket: <b class="num">${pct(base, 2)}</b>. The baseline ignores history.</p>`
      : `<div class="bars">${barRows(top.map((p) => ({
        labelHtml: `${pk(p)}`, value: probs[p], ref: base, ci: n ? ci(p) : null,
        tip: `${C.label(p)}: estimate ${pct(probs[p], 2)} vs ${pct(base, 2)} baseline. Seen ${cnt[p]} of ${n}; 95% range for its ${wcs ? 'weighted ' : ''}rate ${pct(ci(p)[0], 1)}–${pct(ci(p)[1], 1)}.`,
      })), domain, { alt: true, d: 2 })}</div>
      <p class="small muted" style="margin:0">Bar = estimate, whisker = 95% range of the observed rate, grey tick = baseline ${pct(base, 2)}. Overlapping whiskers and tick mean the data can't tell this pocket from any other.</p>`;

    const allTable = `<details><summary>All ${w.size} pockets</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pocket</th><th class="r">Estimate</th><th class="r">vs base</th><th class="r">Seen</th><th class="r">95% range</th></tr></thead><tbody>
      ${order.map((p) => { const r = ci(p); return `<tr><td>${pk(p)}</td><td class="r">${pct(probs[p], 2)}</td><td class="r">${(probs[p] - base >= 0 ? '+' : '') + ((probs[p] - base) * 100).toFixed(2)}</td><td class="r">${cnt[p]}</td><td class="r">${n ? `${pct(r[0])}–${pct(r[1])}` : '–'}</td></tr>`; }).join('')}
      </tbody></table></div></details>`;

    const cp = C.categoryProbs(probs, w);
    const catHtml = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bet</th><th class="r">Estimate</th><th class="r">Baseline</th><th class="r">Diff</th></tr></thead><tbody>
      ${cp.flatMap((g) => g.items.map((i) => `<tr><td>${esc(i.label)}</td><td class="r">${pct(i.p)}</td><td class="r">${pct(i.base)}</td><td class="r">${(i.p - i.base >= 0 ? '+' : '') + ((i.p - i.base) * 100).toFixed(1)}</td></tr>`)).join('')}
      </tbody></table></div>`;

    const bt = C.backtest(all.map((s) => s.pocket), w, win, params);
    let btHtml;
    if (bt.scored < 30) {
      btHtml = `<div class="verdict na"><span class="ico">i</span><div>A backtest needs at least 50 spins (20 to start from, 30 to score). This dealer has ${all.length}.</div></div>`;
    } else {
      const rows = C.MODELS.map((m) => {
        const r = bt.models[m.id];
        const tag = m.id === 'baseline' ? '' : r.beats ? '<span class="badge good">Beats baseline</span>' : r.worse ? '<span class="badge bad">Worse</span>' : '<span class="badge">No edge</span>';
        return `<tr><td>${esc(m.name)} ${tag}</td><td class="r">${fix(r.logLoss)}</td><td class="r">${m.id === 'baseline' ? '–' : `${r.diff >= 0 ? '+' : ''}${fix(r.diff)} ±${fix(2 * r.se)}`}</td><td class="r">${fix(r.brier, 4)}</td></tr>`;
      }).join('');
      const anyBeats = bt.models.frequency.beats || bt.models.smoothed.beats;
      btHtml = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Model</th><th class="r">Log loss</th><th class="r">vs baseline</th><th class="r">Brier</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${anyBeats
          ? `<div class="verdict flag"><span class="ico">!</span><div><b>A model scored better than the baseline</b> by more than two standard errors over ${bt.scored} spins. Treat this as a lead to re-test on new spins, not proof of an edge.</div></div>`
          : `<div class="verdict ok"><span class="ico">✓</span><div><b>No evidence of an edge.</b> Over ${bt.scored} spins, no model predicted this dealer's next spin better than the fair-wheel baseline.</div></div>`}`;
    }

    const preds = predsOf(d.id);
    const evals = preds.map((p) => ({ p, e: C.evaluate(p, allSpinsOf(d.id)) }));
    const done = evals.filter((x) => x.e);
    const agg = done.length ? {
      ll: C.mean(done.map((x) => x.e.logLoss)), bll: C.mean(done.map((x) => x.e.baseLogLoss)),
      br: C.mean(done.map((x) => x.e.brier)), bbr: C.mean(done.map((x) => x.e.baseBrier)),
    } : null;
    const savedHtml = preds.length ? `
      ${agg ? `<div class="tiles"><div class="tile"><b class="num">${done.length}</b><span>scored of ${preds.length}</span></div><div class="tile"><b class="num">${fix(agg.ll, 2)}</b><span>mean log loss</span></div><div class="tile"><b class="num">${fix(agg.bll, 2)}</b><span>baseline</span></div></div>
        ${(() => { const ps = done.filter((x) => x.p.pick != null); if (!ps.length) return '';
          const ph = ps.filter((x) => x.e.pickHit).length, sh = ps.filter((x) => x.e.sectorHit).length;
          const expS = C.mean(ps.map((x) => x.p.sector.length / x.p.probs.length));
          return `<p class="small" style="margin:0">Saved picks hit <b class="num">${ph}/${ps.length}</b> (chance ${pct(1 / w.size)}); sectors hit <b class="num">${sh}/${ps.length}</b> (chance ${pct(expS)}).</p>`; })()}
        <p class="small muted" style="margin:0">Lower log loss is better. ${done.length < 30 ? 'Fewer than 30 scored estimates; the comparison is not reliable yet.' : agg.ll < agg.bll ? 'Saved estimates have scored better than the baseline so far.' : 'Saved estimates have not beaten the baseline.'}</p>` : '<p class="small muted" style="margin:0">Saved estimates are scored against the next spin recorded after them.</p>'}
      <div class="list">${evals.slice(0, 25).map(({ p, e }) => {
        const best = p.pick ?? p.probs.indexOf(Math.max(...p.probs));
        const hit = (h) => (h ? '<span class="badge good">Hit</span>' : '<span class="badge">Miss</span>');
        return `<div class="item"><div class="grow"><div class="small"><b>${esc(C.MODELS.find((m) => m.id === p.model)?.name || p.model)}</b> v${esc(p.modelVersion)} · ${p.window === 'all' ? 'all' : `last ${p.window}`} · n=${p.n}${esc(paramText(p.model, p.params || {}))}</div>
          <div class="meta">${esc(fmtDT(p.createdAt))} · pick ${C.label(best)} at ${pct(p.probs[best], 2)}${p.sector ? ` · sector ${p.sector.map(C.label).join(' ')}` : ''}</div>
          ${e && p.pick != null ? `<div class="row" style="gap:6px;margin-top:3px"><span class="small">Pick</span>${hit(e.pickHit)}${p.stake ? `<span class="small num">${money(e.pickHit ? 35 * p.stake : -p.stake)}</span>` : ''}<span class="small">Multi</span>${hit(e.sectorHit)}${p.stake ? `<span class="small num">${money((e.sectorHit ? 36 * p.stake : 0) - p.sector.length * p.stake)}</span>` : ''}</div>` : ''}
          <div class="meta">${e ? `Next spin ${pk(e.pocket)} got ${pct(e.p, 2)} (rank ${e.rank}) · log loss <span class="num">${fix(e.logLoss, 2)}</span> vs <span class="num">${fix(e.baseLogLoss, 2)}</span>` : 'Waiting for the next spin'}</div></div></div>`;
      }).join('')}</div>` : '<p class="small muted" style="margin:0">No saved estimates yet. Save one, record the next spin, and it is scored automatically.</p>';

    return `<div class="notice caution"><strong>Estimates, not guarantees</strong>On a fair wheel each spin is independent: past results don't change the next spin's ${pct(base, 2)} per pocket. The backtest below checks whether any model has done better than that on this dealer's own history.</div>
      <section class="card stack">
        <div class="chips" role="group" aria-label="Model">${C.MODELS.map((m) => `<button class="chip" data-act="model" data-v="${m.id}" aria-pressed="${model === m.id}">${esc(m.name)}</button>`).join('')}</div>
        <p class="small muted" style="margin:0">${esc(modelInfo.desc)}</p>
        ${windowChips('pwin', win)}
        ${model === 'weighted' ? `<div class="stack" style="gap:6px"><span class="eyebrow">Weight on recent spins · half-life</span>
          <div class="chips" role="group" aria-label="Half-life">${HALF_LIVES.map((h) => `<button class="chip" data-act="halflife" data-v="${h}" aria-pressed="${params.halfLife === h}">${h} spins</button>`).join('')}</div>
          <p class="small muted" style="margin:0">Weight of a spin by age: latest <b class="num">1.0</b> · ${params.halfLife} ago <b class="num">0.5</b> · ${2 * params.halfLife} ago <b class="num">0.25</b> · ${4 * params.halfLife} ago <b class="num">0.06</b>. Shorter half-life reacts faster but is noisier.</p></div>` : ''}
        ${model === 'smoothed' || model === 'weighted' ? `<label class="f"><span>Smoothing strength α = <b id="alpha-v" class="num">${alpha}</b> pseudo-spins per pocket</span><input id="alpha" type="range" min="1" max="50" step="1" value="${alpha}"></label>` : ''}
      </section>
      ${renderPick(d, w, probs, pockets, win, all)}
      <section class="card stack"><h2>Next-spin estimate</h2>${n || model === 'baseline' ? pocketBars + (model !== 'baseline' ? allTable : '') : '<p class="small muted">No spins in this window yet. The estimate equals the baseline until spins are recorded.</p>'}</section>
      <section class="card stack"><h2>Outside bets</h2>${catHtml}</section>
      <section class="card stack"><h2>How this was made</h2>
        <div class="tbl-wrap"><table class="tbl"><tbody>
          <tr><td>Model</td><td>${esc(modelInfo.name)} v${C.MODEL_VERSION[model]}${esc(paramText(model, params))}</td></tr>
          <tr><td>Data</td><td>${win === 'all' ? 'All' : `Last ${win}`} spins of this dealer only · n = ${n}${wcs ? ` · effective n ≈ ${Math.round(wcs.nEff)} after weighting` : ''}</td></tr>
          <tr><td>Period</td><td>${n ? `${esc(fmtDT(sp[0].t))} → ${esc(fmtDT(sp[n - 1].t))}` : '–'}</td></tr>
          <tr><td>Wheel</td><td>${esc(w.name)} · baseline ${pct(base, 2)}</td></tr>
          <tr><td>Generated</td><td>${esc(fmtDT(Date.now()))}</td></tr>
        </tbody></table></div>
        <button class="btn primary block" data-act="save-pred">Save this estimate for scoring</button>
      </section>
      <section class="card stack"><h2>Backtest</h2><p class="small muted" style="margin:0">Walk-forward over this dealer's history: each spin is scored using only the ${win === 'all' ? '' : `${win} `}spins before it. Lower log loss and Brier are better.</p>${btHtml}</section>
      <section class="card stack"><h2>Saved estimates</h2>${savedHtml}</section>`;
  }

  // ---------- sheets & toast ----------
  function openSheet(html, mount) {
    closeSheet();
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.id = 'scrim';
    scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    scrim.addEventListener('click', (e) => { if (e.target === scrim) closeSheet(); });
    document.body.appendChild(scrim);
    const first = scrim.querySelector('input:not([type=hidden]):not([disabled]), select, textarea, button');
    first?.focus({ preventScroll: true });
    mount?.(scrim.firstElementChild);
  }
  function closeSheet() { $('#scrim')?.remove(); }

  let toastTimer = null;
  function toast(msg, actLabel, actFn, ms = 4500) {
    $('#toast')?.remove();
    clearTimeout(toastTimer);
    const el = document.createElement('div');
    el.className = 'toast';
    el.id = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = `<span></span>${actLabel ? `<button>${esc(actLabel)}</button>` : ''}`;
    el.firstChild.textContent = msg;
    if (actLabel) el.querySelector('button').onclick = () => { el.remove(); actFn(); };
    document.body.appendChild(el);
    toastTimer = setTimeout(() => el.remove(), ms);
  }

  // tooltip for chart marks
  const tipEl = () => $('#tip') || Object.assign(document.body.appendChild(document.createElement('div')), { id: 'tip', className: 'tip', hidden: true });
  function showTip(target) {
    const msg = target.dataset.tip;
    if (!msg) return;
    const t = tipEl();
    t.textContent = msg;
    t.hidden = false;
    const r = target.getBoundingClientRect();
    const tw = t.offsetWidth, th = t.offsetHeight;
    t.style.left = `${Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2))}px`;
    t.style.top = `${r.top - th - 8 < 8 ? r.bottom + 8 : r.top - th - 8}px`;
  }
  function hideTip() { const t = $('#tip'); if (t) t.hidden = true; }

        <label class="f"><span>Location</span><input class="in" name="location" id="f-cloc" maxlength="120" value="${esc(c.location)}" placeholder="Singapore"></label>

        <button class="btn primary block">${isNew ? 'Add casino' : 'Save changes'}</button>

        <label class="f"><span>Table number</span><input class="in" name="table" id="f-dtable" maxlength="20" value="${esc(d.table)}" placeholder="Optional"></label>
        <label class="f"><span>Wheel</span><select class="in" name="wheel" id="f-dwheel" ${locked ? 'disabled' : ''}><option value="EU" ${d.wheel !== 'US' ? 'selected' : ''}>European (single 0)</option><option value="US" ${d.wheel === 'US' ? 'selected' : ''}>American (0 and 00)</option></select>
          ${locked ? '<span class="small">Locked because spins are recorded against this wheel.</span>' : ''}</label>
        <label class="f"><span>Notes</span><textarea class="in" name="notes" id="f-dnotes" maxlength="2000">${esc(d.notes)}</textarea></label>

        ${isNew ? '' : `<div class="row"><button type="button" class="btn" data-act="archive-dealer">${d.status === 'archived' ? 'Restore from archive' : 'Archive dealer'}</button>
          <button type="button" class="btn danger" data-act="remove-dealer">Remove…</button></div><div id="confirm-slot"></div>`}
      </form>`);

  function spinForm(d, s) {
    const w = wheelOf(d);
    openSheet(`<h2>Spin ${pk(s.pocket)}</h2>
      <form data-form="spin" class="stack" data-id="${s.id}">
        <div class="grid2">
          <label class="f"><span>Pocket</span><select class="in" name="pocket" id="f-spocket">${w.pockets.map((p) => `<option value="${p}" ${p === s.pocket ? 'selected' : ''}>${C.label(p)} · ${C.colorOf(p)}</option>`).join('')}</select></label>
          <label class="f"><span>Spin time</span><input class="in" type="datetime-local" step="1" name="t" id="f-stime" value="${toLocalInput(s.t)}" required></label>

        ${s.log?.length ? `<details><summary>Change log (${s.log.length})</summary><div class="small stack" style="gap:4px;margin-top:6px">${s.log.slice().reverse().map((l) => `<div>${esc(fmtDT(l.at))}: ${l.action ? esc(l.action) : `was ${esc(C.label(l.pocket))} at ${esc(fmtClock(l.t))}${l.session ? ` · ${esc(l.session)}` : ''}`}</div>`).join('')}</div></details>` : ''}
